<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#4f46e5" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>
		<script>
			// Apply saved theme and language before first paint to avoid a flash
			try {
				const theme =
					localStorage.getItem('theme') ||
					(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
				const lang = localStorage.getItem('language') || 'en';
				document.documentElement.classList.toggle('dark', theme === 'dark');
				document.documentElement.lang = lang;
				document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
